openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: RanchTrack Cattle Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: cattle
    description: Cattle management
  - name: tasks
    description: Farm task management
  - name: fields
    description: Field/pasture management
  - name: employees
    description: Employee management
  - name: settings
    description: Farm settings
  - name: dashboard
    description: Dashboard data
  - name: time-entries
    description: Time card and employee clock-in/out
  - name: crops
    description: Crop planting and harvest tracking
  - name: storage
    description: Grain storage bins and silos
  - name: equipment
    description: Equipment and maintenance logs
  - name: inputs
    description: Seed, fertilizer, and chemical inputs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/employee-login:
    post:
      operationId: loginEmployee
      tags: [auth]
      summary: Login as employee/employer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeLogin"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session info
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated

  /auth/farm-type:
    patch:
      operationId: setFarmType
      tags: [auth]
      summary: Set the farm type (cattle, grain, or both)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFarmTypeBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard stats and recent data
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /cattle:
    get:
      operationId: listCattle
      tags: [cattle]
      summary: List all active cattle for the farm
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by tag number or name
        - name: status
          in: query
          schema:
            type: string
            enum: [active, sold, deceased]
          description: Filter by status
        - name: gender
          in: query
          schema:
            type: string
          description: Filter by gender
      responses:
        "200":
          description: List of cattle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cattle"
    post:
      operationId: createCattle
      tags: [cattle]
      summary: Register new cattle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CattleInput"
      responses:
        "201":
          description: Cattle registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cattle"

  /cattle/{id}:
    get:
      operationId: getCattle
      tags: [cattle]
      summary: Get cattle details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cattle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CattleDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCattle
      tags: [cattle]
      summary: Update cattle record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CattleUpdate"
      responses:
        "200":
          description: Updated cattle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cattle"
    delete:
      operationId: deleteCattle
      tags: [cattle]
      summary: Delete cattle record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /cattle/{id}/status:
    patch:
      operationId: updateCattleStatus
      tags: [cattle]
      summary: Mark cattle as sold or deceased
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CattleStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cattle"

  /cattle/{id}/weights:
    get:
      operationId: listWeights
      tags: [cattle]
      summary: Get weight history for cattle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Weight records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightRecord"
    post:
      operationId: addWeight
      tags: [cattle]
      summary: Add weight record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightInput"
      responses:
        "201":
          description: Weight recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightRecord"

  /cattle/{id}/health:
    get:
      operationId: listHealthRecords
      tags: [cattle]
      summary: Get health records for cattle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Health records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthRecord"
    post:
      operationId: addHealthRecord
      tags: [cattle]
      summary: Add health record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthInput"
      responses:
        "201":
          description: Health record added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List farm tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed]
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Post a new job/task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update task (including mark complete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /fields:
    get:
      operationId: listFields
      tags: [fields]
      summary: List all fields/pastures
      responses:
        "200":
          description: Field list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Field"
    post:
      operationId: createField
      tags: [fields]
      summary: Add a new field/pasture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldInput"
      responses:
        "201":
          description: Field created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"

  /fields/{id}:
    patch:
      operationId: updateField
      tags: [fields]
      summary: Update field
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldUpdate"
      responses:
        "200":
          description: Updated field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
    delete:
      operationId: deleteField
      tags: [fields]
      summary: Delete field
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /crops:
    get:
      operationId: listCrops
      tags: [crops]
      summary: List all crop plantings
      responses:
        "200":
          description: Crop list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Crop"
    post:
      operationId: createCrop
      tags: [crops]
      summary: Add a crop planting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CropInput"
      responses:
        "201":
          description: Crop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crop"

  /crops/{id}:
    patch:
      operationId: updateCrop
      tags: [crops]
      summary: Update crop planting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CropUpdate"
      responses:
        "200":
          description: Updated crop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crop"
    delete:
      operationId: deleteCrop
      tags: [crops]
      summary: Delete crop planting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /storage-bins:
    get:
      operationId: listStorageBins
      tags: [storage]
      summary: List all storage bins
      responses:
        "200":
          description: Storage bin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageBin"
    post:
      operationId: createStorageBin
      tags: [storage]
      summary: Add a storage bin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageBinInput"
      responses:
        "201":
          description: Storage bin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageBin"

  /storage-bins/{id}:
    patch:
      operationId: updateStorageBin
      tags: [storage]
      summary: Update storage bin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageBinUpdate"
      responses:
        "200":
          description: Updated storage bin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageBin"
    delete:
      operationId: deleteStorageBin
      tags: [storage]
      summary: Delete storage bin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      summary: List all equipment
      responses:
        "200":
          description: Equipment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"
    post:
      operationId: createEquipment
      tags: [equipment]
      summary: Add equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentInput"
      responses:
        "201":
          description: Equipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  /equipment/{id}:
    patch:
      operationId: updateEquipment
      tags: [equipment]
      summary: Update equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentUpdate"
      responses:
        "200":
          description: Updated equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    delete:
      operationId: deleteEquipment
      tags: [equipment]
      summary: Delete equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /equipment/{id}/maintenance:
    get:
      operationId: listMaintenanceLogs
      tags: [equipment]
      summary: List maintenance logs for equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Maintenance log list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceLog"
    post:
      operationId: addMaintenanceLog
      tags: [equipment]
      summary: Add a maintenance log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceLogInput"
      responses:
        "201":
          description: Maintenance log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceLog"

  /maintenance/{id}:
    delete:
      operationId: deleteMaintenanceLog
      tags: [equipment]
      summary: Delete maintenance log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inputs:
    get:
      operationId: listInputs
      tags: [inputs]
      summary: List all inputs (seed/fertilizer/chemical)
      responses:
        "200":
          description: Input list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Input"
    post:
      operationId: createInput
      tags: [inputs]
      summary: Add an input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputInput"
      responses:
        "201":
          description: Input created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Input"

  /inputs/{id}:
    patch:
      operationId: updateInput
      tags: [inputs]
      summary: Update input
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputUpdate"
      responses:
        "200":
          description: Updated input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Input"
    delete:
      operationId: deleteInput
      tags: [inputs]
      summary: Delete input
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inputs/{id}/applications:
    get:
      operationId: listInputApplications
      tags: [inputs]
      summary: List application records for an input
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InputApplication"
    post:
      operationId: addInputApplication
      tags: [inputs]
      summary: Record an input application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputApplicationInput"
      responses:
        "201":
          description: Application recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputApplication"

  /input-applications/{id}:
    delete:
      operationId: deleteInputApplication
      tags: [inputs]
      summary: Delete input application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all staff members
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Add a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Employee added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get farm settings
      responses:
        "200":
          description: Farm settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update farm settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSettings"

  /settings/account:
    delete:
      operationId: deleteAccount
      tags: [settings]
      summary: Delete farm account and all data
      responses:
        "200":
          description: Account deleted

  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [time-entries]
      summary: List all time entries for the farm
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        "401":
          description: Unauthorized

  /time-entries/current:
    get:
      operationId: getCurrentStatus
      tags: [time-entries]
      summary: Get current clock-in status for the logged-in employee
      responses:
        "200":
          description: Current clock status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentClockStatus"
        "401":
          description: Unauthorized

  /time-entries/clock-in:
    post:
      operationId: clockIn
      tags: [time-entries]
      summary: Clock in
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockInInput"
      responses:
        "201":
          description: Clocked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Already clocked in
        "401":
          description: Unauthorized

  /time-entries/clock-out:
    post:
      operationId: clockOut
      tags: [time-entries]
      summary: Clock out
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockOutInput"
      responses:
        "200":
          description: Clocked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Not clocked in
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    EmployeeLogin:
      type: object
      required: [farmEmail, username, password]
      properties:
        farmEmail:
          type: string
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [farmId, farmName, email, role]
      properties:
        farmId:
          type: integer
        farmName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, employer, employee]
        employeeId:
          type: ["integer", "null"]
        employeeName:
          type: ["string", "null"]
        farmType:
          type: ["string", "null"]
          enum: [cattle, grain, both, null]

    SetFarmTypeBody:
      type: object
      required: [farmType]
      properties:
        farmType:
          type: string
          enum: [cattle, grain, both]

    DashboardData:
      type: object
      required: [totalHerd, activeHead, calves, activeTasks, recentRegistrations]
      properties:
        totalHerd:
          type: integer
        activeHead:
          type: integer
        calves:
          type: integer
        activeTasks:
          type: integer
        recentRegistrations:
          type: array
          items:
            $ref: "#/components/schemas/Cattle"
        herdChange:
          type: ["number", "null"]
        tasksTrend:
          type: ["string", "null"]
        acresPlanted:
          type: ["number", "null"]
        expectedYield:
          type: ["number", "null"]
        storedGrain:
          type: ["number", "null"]
        equipmentNeedingService:
          type: ["integer", "null"]

    Cattle:
      type: object
      required: [id, tagNumber, gender, status, createdAt]
      properties:
        id:
          type: integer
        tagNumber:
